<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#121318" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="pinkOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2d55" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ff2d55" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0071e3" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0071e3" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#af52de" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#af52de" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f5f5f7" />
      <stop offset="100%" stop-color="#2997ff" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff375f" />
      <stop offset="100%" stop-color="#2997ff" />
    </linearGradient>
    
    <!-- Filter for subtle blur -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="24" fill="url(#bgGradient)" />

  <!-- Atmospheric Glowing Mesh Orbs -->
  <circle cx="200" cy="80" r="180" fill="url(#pinkOrb)" filter="url(#softGlow)" />
  <circle cx="1020" cy="340" r="220" fill="url(#blueOrb)" filter="url(#softGlow)" />
  <circle cx="650" cy="200" r="160" fill="url(#purpleOrb)" filter="url(#softGlow)" />

  <!-- Inner Liquid Glass Card -->
  <rect x="60" y="50" width="1080" height="320" rx="24" fill="url(#glassCard)" stroke="url(#glassBorder)" stroke-width="1.5" />

  <!-- Top Apple Nav Pill -->
  <rect x="95" y="80" width="220" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
  <circle cx="115" cy="98" r="4" fill="#30d158" />
  <text x="130" y="103" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f5f5f7" letter-spacing="0.5">APPLE LIQUID GLASS</text>

  <!-- Title Badge -->
  <rect x="920" y="80" width="180" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
  <text x="945" y="103" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#2997ff" letter-spacing="0.5">AUTO-YEAR ENGINE</text>

  <!-- Main Headline -->
  <text x="95" y="175" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="44" font-weight="700" fill="url(#textGrad)" letter-spacing="-1.2">
    Text-to-Image AI Studio
  </text>
  <text x="95" y="222" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="28" font-weight="600" fill="url(#accentGrad)" letter-spacing="-0.5">
    Visual Poetry &amp; Celebration Keepsakes
  </text>

  <!-- Subtitle -->
  <text x="95" y="265" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" letter-spacing="-0.2">
    Powered by Neural Diffusion • Realistic Ballistic Fireworks • Cupertino Fluid Motion
  </text>

  <!-- Feature Pills Bottom Row -->
  <g transform="translate(95, 305)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="170" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
    <text x="85" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="500" fill="#f5f5f7">🎨 Neural Diffusion 8K</text>

    <!-- Pill 2 -->
    <rect x="185" y="0" width="185" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
    <text x="277" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="500" fill="#f5f5f7">🎆 Realistic Physics Canvas</text>

    <!-- Pill 3 -->
    <rect x="385" y="0" width="165" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
    <text x="467" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="500" fill="#f5f5f7">💖 Anniversary Studio</text>

    <!-- Pill 4 -->
    <rect x="565" y="0" width="185" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
    <text x="657" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="500" fill="#f5f5f7">🔄 Auto Year Sync (2026+)</text>
  </g>
</svg>
