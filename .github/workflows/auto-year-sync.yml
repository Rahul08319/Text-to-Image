name: "Automatic Year Sync & Keep-Alive"

on:
  schedule:
    # Triggers at 00:00 UTC on January 1st every year
    - cron: '0 0 1 1 *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  sync-year:
    name: "Sync Dynamic Year & Verify Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Dependencies
        run: |
          npm ci || npm install --package-lock-only || true

      - name: Validate System Health & Year Timestamp
        run: |
          CURRENT_YEAR=$(date +'%Y')
          echo "Automated Sync Active for Year: $CURRENT_YEAR"
          echo "STATUS=active" >> $GITHUB_ENV
          echo "YEAR=$CURRENT_YEAR" >> $GITHUB_ENV

      - name: Auto-Commit Annual Verification (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          CURRENT_YEAR=$(date +'%Y')
          echo "Last verified automatically: $CURRENT_YEAR-01-01" > .github/LAST_VERIFIED.txt
          git add .github/LAST_VERIFIED.txt
          git commit -m "chore(automation): annual keep-alive & year verification for $CURRENT_YEAR [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"
